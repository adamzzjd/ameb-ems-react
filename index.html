<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adamawa State Mass Education Board — Official Government Website for adult literacy, non-formal education, and vocational training across all 21 LGAs of Adamawa State, Nigeria." />
    <meta name="theme-color" content="#1A5C38" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Adamawa State Mass Education Board — Official Government Website</title>

    <!-- Social sharing. These are what WhatsApp/Facebook/X read (they do not
         run JS), so every shared link falls back to this site-wide card;
         per-page tags are applied at runtime for search engines. -->
    <link rel="canonical" href="https://asmeb.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Adamawa State Mass Education Board" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Adamawa State Mass Education Board — Official Government Website" />
    <meta property="og:description" content="Adult literacy, non-formal education and vocational training across all 21 LGAs of Adamawa State, Nigeria." />
    <meta property="og:url" content="https://asmeb.vercel.app/" />
    <meta property="og:image" content="https://asmeb.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adamawa State Mass Education Board" />
    <meta name="twitter:description" content="Adult literacy, non-formal education and vocational training across all 21 LGAs of Adamawa State, Nigeria." />
    <meta name="twitter:image" content="https://asmeb.vercel.app/og-image.png" />        <!-- Images come from Cloudinary; opening the connection here saves a
             TLS handshake on the critical path of the first paint. -->
        <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

        <!-- Google Fonts: Playfair Display (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

    <!-- Theme initialization (prevents flash of wrong theme) -->
    <script>
      (function() {
        try {
          // Must match STORAGE_KEY in src/hooks/useTheme.tsx, or a saved choice
          // is ignored here and the page flashes the wrong theme on every load.
          var saved = localStorage.getItem('ameb-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="google-site-verification" content="2eHxdKRddUh7nPX55w_evCWJcLgNw8VoJhwP43sJMCU" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
