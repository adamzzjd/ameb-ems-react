<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ADSMEB — Adamawa State Mass Education Board</title>
  <defs>
    <linearGradient id="flame" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFD45C"/>
      <stop offset="1" stop-color="#E08A0C"/>
    </linearGradient>
  </defs>

  <g transform="translate(256,256) scale(1.16) translate(-256,-257)">
<!-- flame of knowledge: pointed tip, curled shoulder -->
  <path d="M262 44
           C 268 108, 306 132, 332 168
           C 356 200, 358 246, 332 278
           C 310 306, 268 316, 236 306
           C 196 294, 172 258, 178 218
           C 183 184, 206 158, 224 128
           C 228 156, 236 172, 250 184
           C 234 142, 240 88, 262 44 Z"
        fill="url(#flame)"/>
  <!-- inner flame -->
  <path d="M258 156
           C 262 190, 288 202, 294 228
           C 300 256, 282 278, 256 278
           C 230 278, 212 256, 218 230
           C 223 208, 244 190, 258 156 Z"
        fill="#0A6136"/>

  <!-- open book: left page -->
  <path d="M249 356
           C 203 322, 138 312, 66 322
           L 66 442
           C 138 432, 203 442, 249 470 Z"
        fill="#0A6136"/>
  <!-- open book: right page -->
  <path d="M263 356
           C 309 322, 374 312, 446 322
           L 446 442
           C 374 432, 309 442, 263 470 Z"
        fill="#10914E"/>

  <!-- page lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M112 360 C 152 362, 187 372, 211 385"/>
    <path d="M112 402 C 152 404, 187 414, 211 427"/>
    <path d="M400 360 C 360 362, 325 372, 301 385"/>
    <path d="M400 402 C 360 404, 325 414, 301 427"/>
  </g>
</g>
</svg>
